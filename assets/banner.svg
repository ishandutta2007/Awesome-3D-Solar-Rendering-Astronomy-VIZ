<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141c3a"/>
      <stop offset="50%" stop-color="#0a0e22"/>
      <stop offset="100%" stop-color="#03050d"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="35%" stop-color="#ff7043" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#e91e63" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e91e63" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetGlow1" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="70%" stop-color="#00838f"/>
      <stop offset="100%" stop-color="#004d40"/>
    </radialGradient>
    <radialGradient id="planetGlow2" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="60%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#80d8ff"/>
      <stop offset="40%" stop-color="#b388ff"/>
      <stop offset="80%" stop-color="#ff80ab"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      .orbit-path {
        stroke-dasharray: 6 6;
        animation: rotateOrbit 40s linear infinite;
        transform-origin: 600px 210px;
      }
      .orbit-path-rev {
        stroke-dasharray: 4 8;
        animation: rotateOrbitRev 55s linear infinite;
        transform-origin: 600px 210px;
      }
      .pulsing-sun {
        animation: sunPulse 4s ease-in-out infinite alternate;
        transform-origin: 600px 210px;
      }
      .twinkle-fast {
        animation: starTwinkle 2s ease-in-out infinite alternate;
      }
      .twinkle-slow {
        animation: starTwinkle 3.5s ease-in-out infinite alternate;
      }
      .floating-pill {
        animation: floatPill 5s ease-in-out infinite alternate;
      }
      .floating-pill-delay {
        animation: floatPill 6s ease-in-out 1.5s infinite alternate;
      }

      @keyframes rotateOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateOrbitRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes sunPulse {
        0% { transform: scale(0.96); opacity: 0.85; }
        100% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes starTwinkle {
        0% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; }
        100% { opacity: 0.3; transform: scale(1.2); }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
    </style>
  </defs>

  <!-- Background Space Layer -->
  <rect width="1200" height="420" fill="url(#bgGlow)" rx="16"/>

  <!-- Starfield Points -->
  <g fill="#ffffff">
    <circle cx="80" cy="65" r="1.5" class="twinkle-fast"/>
    <circle cx="170" cy="120" r="1.2" class="twinkle-slow"/>
    <circle cx="240" cy="45" r="1.8" class="twinkle-fast"/>
    <circle cx="310" cy="90" r="1" class="twinkle-slow"/>
    <circle cx="420" cy="50" r="2" class="twinkle-fast"/>
    <circle cx="530" cy="80" r="1" class="twinkle-slow"/>
    <circle cx="680" cy="40" r="1.5" class="twinkle-fast"/>
    <circle cx="790" cy="85" r="2" class="twinkle-slow"/>
    <circle cx="890" cy="55" r="1.2" class="twinkle-fast"/>
    <circle cx="980" cy="110" r="1.6" class="twinkle-slow"/>
    <circle cx="1080" cy="60" r="1.4" class="twinkle-fast"/>
    <circle cx="1130" cy="140" r="2.2" class="twinkle-slow"/>
    
    <circle cx="95" cy="350" r="1.5" class="twinkle-slow"/>
    <circle cx="180" cy="380" r="1.2" class="twinkle-fast"/>
    <circle cx="280" cy="340" r="2" class="twinkle-slow"/>
    <circle cx="390" cy="370" r="1" class="twinkle-fast"/>
    <circle cx="750" cy="365" r="1.6" class="twinkle-fast"/>
    <circle cx="870" cy="340" r="1.3" class="twinkle-slow"/>
    <circle cx="990" cy="375" r="2.1" class="twinkle-fast"/>
    <circle cx="1100" cy="330" r="1.5" class="twinkle-slow"/>
  </g>

  <!-- Constellation Accent Lines -->
  <g stroke="rgba(128, 216, 255, 0.22)" stroke-width="1" fill="none">
    <polyline points="80,65 170,120 240,45" />
    <polyline points="980,110 1080,60 1130,140" />
    <polyline points="180,380 280,340 390,370" />
  </g>

  <!-- Dynamic Orbit Rings in Background -->
  <g>
    <!-- Central Solar Glow Core -->
    <circle cx="600" cy="210" r="95" fill="url(#sunGlow)" class="pulsing-sun"/>
    
    <!-- Inner Orbit 1 -->
    <ellipse cx="600" cy="210" rx="360" ry="140" fill="none" stroke="rgba(128, 222, 234, 0.25)" stroke-width="1.5" class="orbit-path"/>
    <!-- Outer Orbit 2 -->
    <ellipse cx="600" cy="210" rx="510" ry="180" fill="none" stroke="rgba(179, 136, 255, 0.2)" stroke-width="1.2" class="orbit-path-rev"/>
    
    <!-- Orbiting Celestial Bodies (subtle ambient movement) -->
    <g class="orbit-path">
      <circle cx="960" cy="210" r="11" fill="url(#planetGlow1)"/>
      <circle cx="960" cy="210" r="17" fill="none" stroke="rgba(128, 222, 234, 0.4)" stroke-width="1"/>
    </g>
    <g class="orbit-path-rev">
      <circle cx="100" cy="210" r="15" fill="url(#planetGlow2)"/>
      <ellipse cx="100" cy="210" rx="26" ry="6" fill="none" stroke="rgba(255, 204, 128, 0.5)" stroke-width="1.5" transform="rotate(-18 100 210)"/>
    </g>
  </g>

  <!-- High-Contrast Frosted Card Backdrop for Text Clarity -->
  <rect x="180" y="70" width="840" height="235" rx="20" fill="rgba(8, 12, 28, 0.78)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Foreground Title and Branding Elements -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Category Mini-Tag -->
    <text x="600" y="112" font-size="13" font-weight="700" letter-spacing="3.5" fill="#80d8ff">
      🌌 CURATED ASTRONOMY &amp; 3D RENDERING ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="165" font-size="37" font-weight="900" letter-spacing="0.5" fill="url(#textGrad)">
      Awesome 3D Solar Rendering &amp; Astronomy Viz
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="202" font-size="15" font-weight="400" fill="#cfd8dc" letter-spacing="0.5">
      Interactive 3D Planetariums • Real-Time Ephemeris Simulators • WebGL Celestial Sky Atlases
    </text>

    <!-- Feature Description Line -->
    <text x="600" y="228" font-size="13" font-weight="300" fill="#90a4ae">
      Comprehensive Directory of SaaS Space Platforms &amp; Open-Source Astrophysics Engines
    </text>

    <!-- Pill Badges inside the Card -->
    <g transform="translate(230, 250)">
      <!-- Pill 1 -->
      <g class="floating-pill">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#pillGrad)" stroke="rgba(128, 216, 255, 0.35)" stroke-width="1"/>
        <text x="67" y="22" font-size="12" font-weight="600" fill="#80d8ff">🔭 Planetariums</text>
      </g>

      <!-- Pill 2 -->
      <g class="floating-pill-delay" transform="translate(150, 0)">
        <rect x="0" y="0" width="145" height="34" rx="17" fill="url(#pillGrad)" stroke="rgba(179, 136, 255, 0.35)" stroke-width="1"/>
        <text x="72" y="22" font-size="12" font-weight="600" fill="#b388ff">🪐 Orbit Dynamics</text>
      </g>

      <!-- Pill 3 -->
      <g class="floating-pill" transform="translate(310, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="url(#pillGrad)" stroke="rgba(255, 128, 171, 0.35)" stroke-width="1"/>
        <text x="67" y="22" font-size="12" font-weight="600" fill="#ff80ab">⚡ WebGL &amp; FITS</text>
      </g>

      <!-- Pill 4 -->
      <g class="floating-pill-delay" transform="translate(460, 0)">
        <rect x="0" y="0" width="150" height="34" rx="17" fill="url(#pillGrad)" stroke="rgba(255, 213, 79, 0.35)" stroke-width="1"/>
        <text x="75" y="22" font-size="12" font-weight="600" fill="#ffd54f">🛰️ Space Missions</text>
      </g>

      <!-- Pill 5 -->
      <g class="floating-pill" transform="translate(625, 0)">
        <rect x="0" y="0" width="115" height="34" rx="17" fill="url(#pillGrad)" stroke="rgba(105, 240, 174, 0.35)" stroke-width="1"/>
        <text x="57" y="22" font-size="12" font-weight="600" fill="#69f0ae">✨ Open Source</text>
      </g>
    </g>
  </g>

  <!-- Subtle Bottom Coordinate Accent -->
  <text x="600" y="380" font-family="monospace" font-size="11" fill="rgba(144, 164, 174, 0.6)" text-anchor="middle" letter-spacing="2">
    RA 17h 45m 40.04s | Dec -29° 00′ 28.1″ • SAGITTARIUS A* • REAL-TIME EPHEMERIS
  </text>
</svg>